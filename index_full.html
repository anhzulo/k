<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Heart Particles + Text Rings — Three.js</title>
  <meta name="description" content="Hiệu ứng trái tim bằng hạt + vòng chữ 3D sử dụng Three.js" />
  <style>
    html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:Inter,system-ui,Arial}
    #info{position:fixed;left:12px;top:12px;color:#ddd;z-index:10;background:rgba(0,0,0,0.35);padding:8px 12px;border-radius:8px;font-size:13px}
    a.link{color:#9be7ff}
    .ui-right{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;z-index:10}
    .ui-btn{width:54px;height:54px;border-radius:27px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,0.6)}
    .ui-small{width:44px;height:44px;border-radius:22px}
  </style>
</head>
<body>
  <div id="info">Three.js heart + text rings demo — click to toggle autoplay rotation</div>
  <div class="ui-right">
    <div class="ui-btn">+</div>
    <div class="ui-btn ui-small">❤</div>
    <div class="ui-btn ui-small">💬</div>
    <div class="ui-btn ui-small">↻</div>
  </div>
  <canvas id="c"></canvas>
  <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.152.2/examples/js/controls/OrbitControls.js"></script>
  <script>
    const CANVAS = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({canvas:CANVAS,antialias:true,alpha:true});
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 1);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 2000);
    camera.position.set(0, 40, 140);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 50;
    controls.maxDistance = 300;

    const hemi = new THREE.HemisphereLight(0x808080, 0x101020, 0.6);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.6);
    dir.position.set(50,100,50);
    scene.add(dir);

    function heart2D(t){
      const x = 16*Math.pow(Math.sin(t),3);
      const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      return [x, y];
    }

    const particleCount = 12000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);
    const colorInside = new THREE.Color(0x9be7ff);
    const colorOuter = new THREE.Color(0x1b998b);

    for(let i=0;i<particleCount;i++){
      const t = Math.random()*Math.PI*2;
      const [hx, hy] = heart2D(t);
      const rz = (Math.random()-0.5) * 40;
      const scale = 1.6;
      positions[i*3+0] = hx * scale + (Math.random()-0.5)*2;
      positions[i*3+1] = hy * scale + (Math.random()-0.5)*2 - 8;
      positions[i*3+2] = rz;
      const l = (hy + 18) / 36;
      const col = colorInside.clone().lerp(colorOuter, 1 - l);
      colors[i*3+0] = col.r;
      colors[i*3+1] = col.g;
      colors[i*3+2] = col.b;
      sizes[i] = 6 + Math.random()*6;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
    geometry.setAttribute('customColor', new THREE.BufferAttribute(colors,3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes,1));

    const vertexShader = `
      attribute float size;
      attribute vec3 customColor;
      varying vec3 vColor;
      void main(){
        vColor = customColor;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (300.0 / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
      }
    `;
    const fragmentShader = `
      varying vec3 vColor;
      void main(){
        float dist = length(gl_PointCoord - vec2(0.5));
        float alpha = smoothstep(0.5, 0.12, dist);
        gl_FragColor = vec4(vColor, alpha);
      }
    `;
    const material = new THREE.ShaderMaterial({vertexShader, fragmentShader, transparent:true, depthWrite:false});
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    const rings = [];
    const ringTexts = ['Chúc Hoan trung thu ấm áp hạnh phúc','Chúc Hoan trung thu ấm áp hạnh phúc','Chúc Hoan trung thu ấm áp hạnh phúc'];

    function makeTextSprite(text, fontSize=48, padding=20){
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.font = `${fontSize}px Inter, Arial`;
      const metrics = ctx.measureText(text);
      const w = metrics.width + padding*2;
      const h = fontSize + padding*2;
      canvas.width = Math.min(2048, Math.ceil(w));
      canvas.height = h;
      const ctx2 = canvas.getContext('2d');
      ctx2.font = `${fontSize}px Inter, Arial`;
      ctx2.textBaseline = 'middle';
      ctx2.fillStyle = 'rgba(255,255,255,0.95)';
      ctx2.fillText(text, padding, canvas.height/2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      const material = new THREE.SpriteMaterial({map:texture, transparent:true});
      return new THREE.Sprite(material);
    }

    const ringConfigs = [
      {radius:60, count:40, y:-40, scale:0.8},
      {radius:44, count:34, y:-30, scale:0.75},
      {radius:28, count:28, y:-20, scale:0.7}
    ];
    ringConfigs.forEach((cfg, idx)=>{
      const group = new THREE.Group();
      for(let i=0;i<cfg.count;i++){
        const angle = (i / cfg.count) * Math.PI * 2;
        const txt = makeTextSprite(ringTexts[idx%ringTexts.length], 40);
        txt.position.set(Math.cos(angle)*cfg.radius, cfg.y, Math.sin(angle)*cfg.radius);
        txt.scale.set(cfg.scale*12, cfg.scale*3, 1);
        txt.lookAt(0, cfg.y, 0);
        group.add(txt);
      }
      scene.add(group);
      rings.push(group);
    });

    const boxGroup = new THREE.Group();
    for(let i=0;i<3;i++){
      const geom = new THREE.PlaneGeometry(18,18);
      const mat = new THREE.MeshBasicMaterial({color:0xffd37f, transparent:true, opacity:0.98});
      const m = new THREE.Mesh(geom, mat);
      m.position.set(i*8 - 8, -22 + i*2, i*6 - 6);
      m.rotation.y = -0.6 + i*0.5;
      boxGroup.add(m);
    }
    scene.add(boxGroup);

    let last = 0, time = 0;
    function resize(){
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w,h);
      camera.aspect = w/h; camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    let rotationSpeed = 0.15;
    document.body.addEventListener('click', ()=>{ rotationSpeed = rotationSpeed?0:0.15; });

    function animate(ts){
      const dt = (ts - last) / 1000; last = ts; time += dt;
      particles.rotation.y += rotationSpeed * dt;
      rings.forEach((r, i)=>{ r.rotation.y += (0.12 + i*0.06) * dt * (i%2? -1:1); });
      boxGroup.rotation.y += 0.25 * dt;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
    camera.lookAt(0, -8, 0);
  </script>
</body>
</html>
